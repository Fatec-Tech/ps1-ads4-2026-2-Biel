<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pacientes</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <!-- Mensagens de sucesso/erro das operações -->
    <div id="mensagem" class="alert d-none" role="alert"></div>

    <h2 id="titulo-formulario" class="h5 mb-3">Novo paciente</h2>

    <form id="form-paciente" class="row g-3 mb-5">
      <!-- Guarda o ID quando estamos editando; vazio = cadastro novo -->
      <input type="hidden" id="id-paciente">

      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-2">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>

      <div class="col-md-2 d-flex align-items-end gap-2">
        <button type="submit" id="btn-salvar" class="btn btn-primary w-100">Cadastrar</button>
        <button type="button" id="btn-cancelar" class="btn btn-outline-secondary w-100 d-none">Cancelar</button>
      </div>
    </form>

    <h2 class="h4 mb-3">Pacientes cadastrados</h2>

    <!-- Mensagem de carregamento, visível enquanto os dados não chegam -->
    <p id="carregando" class="text-muted">Carregando pacientes...</p>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Data de nascimento</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-pacientes"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
